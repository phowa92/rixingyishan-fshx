<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="text-scale" content="scale"><meta name="theme-color" content="#f8f7f3"><title>填写名单 · 日行一善</title><link rel="stylesheet" href="/style.css?v=confirm-20261117"></head><body data-page="submit"><header class="site-header"><a class="brand" href="/">日行一善 <span>· 功德回向</span></a><nav aria-label="主导航"><a href="/records">查看名单</a></nav></header><main class="inner-page compact-submit"><div class="page-heading"><h1>填写名单</h1><div class="gold-rule"></div><div class="compact-tips"><strong>填写提示</strong><span>登记前请仔细阅读，具体说明如下：</span><div class="tips-list"><div class="important-tip">1）每次填写一个名字。</div><div>2）生僻字请备注拼音，否则会念错。</div><div class="important-tip">3）名字之外的任何字不念！所以切记只填名字！</div></div><small>温馨提示：名单收录保留7日，每日凌晨滚动更新一次。</small></div></div><section class="form-panel"><div class="category-selects"><label>回向类目<select id="group-select"><option value="">请选择类目</option><option value="departed">往生者</option><option value="patients">病患</option><option value="blessings">祈福</option></select></label><label>子类目<select id="minor-select" disabled><option value="">无需选择</option></select></label></div><div id="prayer-preview" class="prayer-preview hidden"></div><div class="names-head"><label for="first-name">填写姓名</label><span id="name-limit">一次一位，点击＋添加下一位（最多5个字符）</span></div><p id="minor-tip" class="minor-tip hidden">直接填写婴灵名字或“某某的堕胎婴灵”</p><div id="name-rows" class="name-rows"></div><p id="form-error" class="form-error hidden" role="alert"></p><label id="submit-confirmation" class="submit-confirmation" for="submit-confirm-check"><input id="submit-confirm-check" type="checkbox"><span>我已认真检查以上回向名单，确认正确无误，并知悉提交后无法自行修改/删除。</span></label><button id="submit-button" class="button button-gold submit-action" type="button" data-confirm-required="true" aria-label="确认提交，请先勾选上方确认文案">确认提交 <span aria-hidden="true">→</span></button></section></main><footer class="site-footer">日行一善 · 功德回向 <span>愿一切众生离苦得乐</span><span class="footer-peace">世界和平·祖国繁荣昌盛</span></footer><script type="module" src="/app.js?v=confirm-20261117"></script></body></html>
