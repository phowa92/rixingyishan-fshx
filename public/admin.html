<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数据管理 · 日行一善</title><link rel="stylesheet" href="/style.css">
</head>
<body data-page="admin">
  <header class="site-header"><a class="brand" href="/">日行一善 <span>· 放生回向</span></a><nav aria-label="主导航"><a href="/records">查看名单</a><button type="button" id="logout" class="nav-button hidden">退出</button></nav></header>
  <main class="admin-page">
    <div class="page-heading"><p class="section-kicker">站点管理</p><h1>数据管理</h1><div class="gold-rule"></div></div>
    <section id="login-panel" class="admin-card login-card">
      <h2>管理员登录</h2>
      <label>邮箱账号<input id="login-name" type="email" autocomplete="username"></label>
      <label>密码<input id="login-password" type="password" autocomplete="current-password"></label>
      <p id="login-error" class="form-error hidden" role="alert"></p>
      <button id="login-button" class="button button-gold" type="button">登录</button>
      <button id="forgot-toggle" class="text-action" type="button">忘记密码？</button>
      <div id="forgot-panel" class="forgot-panel hidden">
        <p class="form-help">输入管理员邮箱，查收临时密码。请在 30 分钟内登录，并在后台修改自己的密码。</p>
        <label>管理员邮箱<input id="reset-email" type="email" autocomplete="email"></label>
        <button id="send-reset" class="button button-light compact" type="button">发送临时密码</button>
        <p id="reset-message" class="form-help" role="status"></p>
      </div>
    </section>
    <div id="admin-content" class="hidden">
      <section class="admin-card">
        <div class="admin-card-head"><h2>名单管理</h2><div class="admin-head-actions"><button id="export-csv" class="button button-light compact" type="button">下载 CSV</button><button id="new-record" class="button button-gold compact" type="button">＋ 新增名单</button></div></div>
        <p class="form-help">后台保留每次实际填写，同名重复记录会逐条显示；前台只显示同类姓名的最新一条。</p>
        <div class="admin-filters"><input id="search-name" placeholder="搜索姓名" aria-label="搜索姓名"><select id="filter-group" aria-label="筛选类目"><option value="">全部类目</option><option value="departed">往生者</option><option value="patients">病患</option><option value="blessings">祈福</option></select></div>
        <div class="table-wrap"><table><thead><tr><th>姓名</th><th>类目</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="admin-rows"></tbody></table></div>
        <div class="pagination"><span id="page-status" role="status"></span><div><button id="page-prev" class="button button-light compact" type="button">上一页</button><button id="page-next" class="button button-light compact" type="button">下一页</button></div></div>
      </section>
      <section id="account-card" class="admin-card hidden"><h2>管理账户</h2><div id="account-list"></div><div class="account-form"><input id="account-name" type="email" placeholder="新管理员邮箱" aria-label="新账号"><input id="account-password" type="password" placeholder="密码（至少12位）" aria-label="新账号密码"><button id="add-account" class="button button-gold compact" type="button">添加账户</button></div></section>
      <section class="admin-card"><h2>修改自己的密码</h2><div class="account-form"><input id="current-password" type="password" autocomplete="current-password" placeholder="当前密码" aria-label="当前密码"><input id="new-password" type="password" autocomplete="new-password" placeholder="新密码（至少12位）" aria-label="新密码"><button id="change-password" class="button button-gold compact" type="button">修改密码</button></div><p id="password-message" class="form-help" role="status"></p></section>
      <section class="admin-card"><h2>清理日志</h2><p class="form-help">每日北京时间 00:00 清理，日志保留90天。</p><div id="cleanup-logs"></div></section>
    </div>
    <dialog id="edit-dialog" class="edit-dialog"><form method="dialog"><h2 id="edit-heading">编辑名单</h2><label>姓名<input id="edit-name"></label><label>大类目<select id="edit-group"><option value="departed">往生者</option><option value="patients">病患</option><option value="blessings">祈福</option></select></label><label id="edit-minor-wrap">子类目<select id="edit-minor"><option value="deceased">亡者</option><option value="infants">堕胎婴灵</option><option value="animals">旁生</option></select></label><p id="edit-error" class="form-error hidden" role="alert"></p><div class="dialog-actions"><button type="button" id="edit-cancel" class="button button-light">取消</button><button type="button" id="edit-save" class="button button-gold">保存</button></div></form></dialog>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
